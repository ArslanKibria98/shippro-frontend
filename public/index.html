      function downloadPDF() {
      const labelElement = document.getElementById("label");
      if (!labelElement) {
          alert("Label not found!");
          return;
      }
      const images = labelElement.getElementsByTagName("img");
      let loadedCount = 0;
  
      function checkAllImagesLoaded() {
          loadedCount++;
          if (loadedCount === images.length) {
              generatePDF(); // Call the PDF function only after all images are loaded
          }
      }
  
      // Add load event listener to each image
      for (let img of images) {
          if (img.complete) {
              checkAllImagesLoaded();  // If already loaded, count it
          } else {
              img.onload = checkAllImagesLoaded;
              img.onerror = checkAllImagesLoaded; // Count errors too
          }
      }
  }
  
  function generatePDF(){
      const labelElement = document.getElementById("label");
  
      // Create a wrapper to keep the exact design without shifting
      const wrapper = document.createElement('div');
      // wrapper.style.width = '100%';
      // wrapper.style.height = '100%';
      wrapper.style.overflow = 'hidden';
      wrapper.style.display = 'flex';
      wrapper.style.justifyContent = 'center';  // Ensure center alignment
      wrapper.style.alignItems = 'center';
      wrapper.style.paddingLeft = '-10px';  // Try adjusting this to fix right shift
      const clonedLabel = labelElement.cloneNode(true);
  
      const shippoLogo = clonedLabel.querySelector('.shippo-logo img');
      
      if (shippoLogo) {
          console.log(shippoLogo)
          shippoLogo.style.width = '120px';  // Explicitly set width to 120px
          shippoLogo.style.maxWidth = '120px';  // Prevent it from stretching
      }
      wrapper.appendChild(labelElement.cloneNode(true));
  
      const options = {
          margin: [0, -5, 0, 0], // Shift content 5px left to fix right shift
          filename: 'USPS_Label.pdf',
          // image: { type: 'jpeg', quality: 1 },
          html2canvas: { 
              scale: 3,   
              dpi: 300, 
              letterRendering: true,
              useCORS: true, 
              scrollY: 0  
          },
          jsPDF: { 
              unit: 'mm', 
              format: [101.6, 152.4],  
              orientation: 'portrait' 
          }
      };
  
      html2pdf().set(options).from(wrapper).save();
  }
